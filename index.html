return`<div class="g2"><div class="box"><h3>${ic('shield','sm')} ${x("Can't open the site?",'Не заходит на сайт?')}</h3>${gd.map((d,i)=>`<details ${i?'':'open'}><summary>${d[0]}</summary><p>${d[1]}</p></details>`).join('')}</div><div class="p2"><div class="box"><h3>${ic('globe','sm')} ${x('Mirrors','Зеркала')}</h3>${mirHtml()}</div><div class="box"><h3>${ic('q','sm')} FAQ</h3>${fq.map(d=>`<details><summary>${d[0]}</summary><p>${d[1]}</p></details>`).join('')}</div><div class="box"><h3>${ic('file','sm')} ${x('Rules & refunds','Правила и возврат')}</h3>${rl().map(d=>`<details><summary>${d[0]}</summary><p>${d[1]}</p></details>`).join('')}<p class="sub"><a href="#rules">${x('Open as a separate page','Открыть отдельной страницей')} →</a></p></div><div class="box"><h3>${ic('chat','sm')} ${x('Support','Поддержка')}</h3>${chatHtml()}</div></div></div>`},
admin(){if(!isAdmin())return V.home();const rev=st.orders.reduce((s,o)=>s+(o.s=='Cancelled'||o.s=='Refunded'?0:o.t),0);return`<h2>${ic('sliders','sm')} Admin <small>(demo)</small></h2><div class="feats"><div class="feat"><b>4 162</b><span>Users</span></div><div class="feat"><b>${st.orders.length}</b><span>Orders</span></div><div class="feat"><b>${$m(rev)}</b><span>Revenue</span></div><div class="feat"><b>${st.proofs.filter(z=>z.s=='Pending').length}</b><span>Pending payments</span></div></div><div class="g2"><div class="box sc"><h3>Prices & stock</h3><table><tr><th>Geo</th><th>Price $</th><th>Stock</th></tr>${Object.keys(G).map(g=>`<tr><td>${G[g][0]}</td><td><input type="number" step=".01" data-act="ap" data-g="${g}" value="${G[g][1]}"></td><td><input type="number" data-act="as" data-g="${g}" value="${G[g][2]}"></td></tr>`).join('')}</table></div><div class="box sc"><h3>Orders</h3>${st.orders.length?`<table>${st.orders.map(o=>`<tr><td>#${o.id}</td><td>${$m(o.t)}</td><td><select data-act="os" data-v="${o.id}">${ST.map(s=>`<option ${s==o.s?'selected':''}>${s}</option>`).join('')}</select></td></tr>`).join('')}</table>`:'<p class="sub">No orders yet.</p>'}</div></div>${qHtml()}${promoAdm()}${opsAdm()}<div class="g2" style="margin-top:12px"><div class="box"><h3>⭐ Reviews moderation</h3>${st.revs.map((r,i)=>`<div class="ln"><span>${stars(r.r)} ${r.t.slice(0,24)}${r.demo?' (demo)':''}</span><button class="pc" data-act="rdel" data-v="${i}">✕</button></div>`).join('')||'<p class="sub">No reviews.</p>'}</div><div class="box sc"><h3>${ic('users','sm')} Referral levels</h3><table><tr><th>Level</th><th>From refs</th><th>% of top-up</th></tr>${REF.map((r,i)=>`<tr><td>${i+1}</td><td><input type="number" ${i?'':'disabled'} data-act="rm" data-v="${i}" value="${r[0]}"></td><td><input type="number" step=".1" data-act="rp" data-v="${i}" value="${r[1]}"></td></tr>`).join('')}</table><div class="ln"><span>Min top-up for reward ($)</span><input type="number" style="width:90px" data-act="rmin" value="${REFMIN}"></div><p class="sub">Reward is credited to the referrer's balance (no withdrawals).</p></div></div><p class="sub">Access only for Telegram IDs from the admin list.</p>`}};

function ban(g){return`<img class="ban" src="${BANIMG[g]}" alt="${GT[g]}">`}
const ks=()=>{let k=Object.keys(G).filter(g=>(GT[g]+' '+G[g][0]).toLowerCase().includes(st.qs.toLowerCase())&&(!st.fo||st.fav[g]));if(st.sort=='pa')k.sort((a,b)=>G[a][1]-G[b][1]);if(st.sort=='pd')k.sort((a,b)=>G[b][1]-G[a][1]);if(st.sort=='sd')k.sort((a,b)=>G[b][2]-G[a][2]);return k};
const stars=n=>'★'.repeat(n)+'☆'.repeat(5-n);
const revHtml=()=>{const n=st.revs.length,avg=n?(st.revs.reduce((a,r)=>a+r.r,0)/n).toFixed(1):'–',done=st.orders.filter(o=>o.s=='Completed'&&!o.rv);
return`<h2 style="margin-top:30px">⭐ ${x('Reviews','Отзывы')} <small>${avg} · ${n}</small></h2><div class="how">${st.revs.slice(0,6).map(r=>`<div class="hw"><div class="stars">${stars(r.r)}</div><p class="sub" style="margin:6px 0">${esc(r.t)}</p><small>${esc(r.n)} · ${r.demo?'DEMO sample':'✔ '+x('Verified purchase','Проверенная покупка')+' #'+r.o}</small></div>`).join('')||`<p class="sub">${x('No reviews yet.','Отзывов пока нет.')}</p>`}</div><div class="box" style="margin-top:12px"><h3>${x('Leave a review','Оставить отзыв')}</h3>`+(done.length?`<select id="ro" style="margin:8px 0">${done.map(o=>`<option value="${o.id}">#${o.id} · ${GT[o.g]} × ${o.q}</option>`).join('')}</select><select id="rr">${[5,4,3,2,1].map(n=>`<option value="${n}">${stars(n)}</option>`).join('')}</select><textarea id="rt" rows="2" placeholder="${x('Your feedback','Ваш отзыв')}" style="margin:8px 0"></textarea><button class="btn" data-act="rev">${x('Publish','Опубликовать')}</button>`:`<p class="sub">${x('Only customers with a completed order can leave a review.','Отзыв могут оставить только покупатели с выполненным заказом.')}</p>`)+`</div>`};
const mirHtml=()=>{const up=st.mir.filter(m=>m.up).sort((a,b)=>a.ms-b.ms)[0];return st.mir.map(m=>`<div class="ln"><span>${m.up?'🟢':'🔴'} ${m.d}</span><b>${m.up?m.ms+' ms':x('blocked','недоступно')}</b></div>`).join('')+`<div class="row" style="margin-top:10px"><button class="pc" data-act="mchk">${x('Check now','Проверить')}</button><button class="pc ${st.auto?'on':''}" data-act="mauto">${x('Auto-switch','Автопереключение')}: ${st.auto?'ON':'OFF'}</button></div><p class="sub">${st.auto?(up?x('If the main domain is blocked you will be redirected to','Если основной домен заблокирован, вас перенаправит на')+' <b>'+up.d+'</b>':x('No mirror available','Нет доступных зеркал')):x('Auto-switch is off — pick a mirror manually.','Автопереключение выключено — выберите зеркало вручную.')}</p>`};
const qHtml=()=>{const L=st.aprf||st.proofs;return`<div class="box" style="margin-top:12px"><h3>💸 Top-up requests <span class="st">${L.filter(z=>z.s=='Pending').length} pending</span></h3>${L.map(z=>`<div class="rq"><div class="ln"><span><b>#${z.id}</b> · @${z.u||'username'}</span><b>${$m(z.a)}</b></div><small>${z.d} · USDT TRC20 · ${z.hash?'TX '+z.hash.slice(0,14)+'…':'no TX hash'}</small>${z.url?`<video controls playsinline preload="metadata" src="${z.url}" style="width:100%;border-radius:12px;margin:8px 0;max-height:220px;background:#000"></video>`:''}<small>🎬 ${z.fn} · ${z.sz}</small>${z.s=='Pending'?`<div class="row" style="margin-top:8px"><button class="btn" data-act="pok" data-v="${z.id}">✅ Approve</button><button class="btn out" data-act="pno" data-v="${z.id}">❌ Decline</button></div>`:`<div style="margin-top:6px"><span class="st ${z.s=='Approved'?'Completed':''}">${z.s}</span> ${z.r||''}</div>`}</div>`).join('')||'<p class="sub">No requests yet. Create a top-up in Wallet and upload a video.</p>'}</div>`};
const bell=()=>{const n=st.nt.filter(z=>z.u).length;$('#bc').textContent=n||''},note=t=>{st.nt.unshift({t,d:T(),u:1});bell()};
const TABS=[['home',ic('bag'),['Shop','Магазин']],['wallet',ic('wallet'),['Wallet','Кошелёк']],['orders',ic('box'),['Orders','Заказы']],['account',ic('user'),['Account','Профиль']],['help',ic('chat'),['Help','Помощь']]];
function render(){let r=location.hash.slice(1);if(r=='shop')r='home';if(!V[r]||(r=='admin'&&!isAdmin()))r='home';st.route=r;$('#app').innerHTML=V[r]();const l=TABS.map(t=>`<a href="#${t[0]}" class="${t[0]==r?'on':''}"><span>${t[1]}</span>${x(...t[2])}</a>`).join('');$('#tabs').innerHTML=l;$('#nav').innerHTML=TABS.map(t=>`<a href="#${t[0]}" class="${t[0]==r?'on':''}">${x(...t[2])}</a>`).join('')+(isAdmin()?'<a href="#admin" class="'+(r=='admin'?'on':'')+'">'+ic('sliders')+'</a>':'');$('#bchip').innerHTML=`${ic('wallet')} <b>${$m(st.bal)}</b>`;$('#lg').textContent=st.lang;bell()}

const USERS=window.USERS=(()=>{let sd=7;const r=()=>(sd=sd*16807%2147483647)/2147483647,N=['alex','maria','dmytro','olena','ivan','sofia','andrii','kate','max','nina','oleh','yulia','taras','vika','roman'];return Array.from({length:60},(_,i)=>({u:'@'+N[i%15]+(i>14?10+Math.floor(r()*89):''),id:1000000000+Math.floor(r()*9e8),b:Math.round(r()*40000)/100,o:Math.floor(r()*30),d:Math.floor(r()*30)}))})();
const utRows=q=>{q=(q||'').toLowerCase().replace('@','');const L=[...(window.API_ON?[]:[{u:'@username',id:1911289577,b:st.bal,o:st.orders.length,d:0}]),...USERS].filter(z=>(z.u+' '+z.id).toLowerCase().includes(q)).sort((a,b)=>b.b-a.b);return`<tr><th>User</th><th>ID</th><th>Balance</th><th>Orders</th><th>Seen</th></tr>`+L.slice(0,20).map(z=>`<tr><td><b>${z.u}</b></td><td>${z.id}</td><td>${$m(z.b)}</td><td>${z.o}</td><td>${z.d?z.d+' d ago':'today'}</td></tr>`).join('')+(L.length?'':'<tr><td colspan="5">No users found</td></tr>')};
window.opsAdm=()=>{st.bc=st.bc||[];return`<div class="g2" style="margin-top:12px"><div class="box"><h3>${ic('bell','sm')} Broadcast</h3><textarea id="bct" rows="2" maxlength="140" placeholder="Message to all users…" style="margin:8px 0"></textarea><button class="btn" data-c="bcast">Send to all (4 162)</button>${st.bc.slice(0,3).map(b=>`<div class="ln"><span>${esc(b.t.slice(0,34))}</span><b>${b.d}</b></div>`).join('')}</div><div class="box"><h3>${ic('dl','sm')} Export CSV</h3><p class="sub">Download data for Excel or Google Sheets.</p><div class="row"><button class="btn out" data-c="csvo">Orders (${st.orders.length})</button><button class="btn out" data-c="csvt">Top-ups (${st.proofs.length})</button></div></div></div><div class="box sc" style="margin-top:12px"><h3>${ic('users','sm')} Clients <span class="st">${USERS.length+1}</span></h3><input id="ucs" placeholder="Search @username or ID" style="margin:8px 0"><table id="ut">${utRows('')}</table></div>`};
const csv=r=>'\ufeff'+r.map(a=>a.map(v=>`"${String(v==null?'':v).replace(/"/g,'""')}"`).join(',')).join('\r\n');
const dlc=(n,r)=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv(r)],{type:'text/csv'}));a.download=n;document.body.appendChild(a);a.click();a.remove();toast('CSV exported')};
const send=()=>{const i=$('#cx'),t=i&&i.value.trim();if(!t)return;i.value='';const c=CH(),m={me:1,t:t.slice(0,300),time:T(),s:'sent'},t0=Date.now();c.push(m);chatUp();fx('tap');
setTimeout(()=>{m.s='seen';chatUp()},900);setTimeout(()=>{st.typing=1;chatUp()},1500);
setTimeout(()=>{st.typing=0;c.push({t:x('Thanks! An operator has your message and will reply here shortly. Please make sure your order ID is included.','Спасибо! Оператор получил сообщение и скоро ответит здесь. Убедитесь, что указан ID заказа.'),time:T(),rt:Math.round((Date.now()-t0)/1000)+' '+x('s','с')});chatUp();fx('add')},3600)};
document.addEventListener('click',e=>{const b=e.target.closest('[data-c]');if(b){const c=b.dataset.c;
if(c=='fx'){FXS.on=!FXS.on;render();fx('add')}else if(c=='send')send();
else if(c=='bcast'){const t=$('#bct').value.trim();if(!t)return toast('Write a message');st.nt.unshift({t:'📣 '+t,d:'now',u:1});st.bc.unshift({t,d:T()});bell();render();toast('Sent to 4 162 users')}
else if(c=='csvo')dlc('orders.csv',[['ID','Date','Name','Geo','Qty','Total','Status'],...st.orders.map(o=>[o.id,o.d,o.k,GT[o.g],o.q,o.t,o.s])]);
else if(c=='csvt')dlc('topups.csv',[['ID','Date','Amount','Status','TX hash','File'],...st.proofs.map(z=>[z.id,z.d,z.a,z.s,z.hash||'',z.fn||''])])}
if(e.target.closest('[data-act="pay"],[data-c="pay"]'))setTimeout(()=>fx('ok'),60);else if(e.target.closest('[data-c="add"]'))fx('add')});
document.addEventListener('input',e=>{if(e.target.id=='ucs')$('#ut').innerHTML=utRows(e.target.value)});
document.addEventListener('keydown',e=>{if(e.target.id=='cx'&&e.key=='Enter')send()});
document.addEventListener('pointerdown',e=>{const b=e.target.closest('.btn,.pc,.ib,.tabs a,.hrt');if(b){b.classList.remove('pls');void b.offsetWidth;b.classList.add('pls');setTimeout(()=>b.classList.remove('pls'),500);fx('tap')}},{passive:true});
let sw=null,sy=0,dy=0;
addEventListener('touchstart',e=>{const m=e.target.closest('.mb');if(!m||e.target.closest('pre,textarea,input,video,.cm')||m.scrollTop>0)return;sw=m;sy=e.touches[0].clientY;dy=0;m.style.transition='none'},{passive:true});
addEventListener('touchmove',e=>{if(!sw)return;dy=Math.max(0,e.touches[0].clientY-sy);sw.style.transform=`translateY(${dy}px)`;sw.style.opacity=1-Math.min(.6,dy/500)},{passive:true});
addEventListener('touchend',()=>{if(!sw)return;const m=sw;sw=null;m.style.transition='transform .3s cubic-bezier(.2,.8,.2,1),opacity .3s';if(dy>110){m.style.transform='translateY(110%)';m.style.opacity=0;setTimeout(()=>modal(''),240);fx('tap')}else{m.style.transform='';m.style.opacity=''}});
})();
</script>
<script>
(()=>{

<script>
(()=>{const API=TG_CFG.API,DU=new URLSearchParams(location.search).get('devuser');window.API_ON=!!API;
let HQ='',HS='';window.HF=z=>(!HS||z.s==HS)&&(!HQ||(z.id+' '+(z.hash||'')+' '+z.a).toLowerCase().includes(HQ));
window.histBar=()=>st.proofs.length?`<div class="row hfl"><input id="hq" placeholder="${x('Search ID, TX, amount','Поиск: ID, TX, сумма')}" value="${esc(HQ)}" style="flex:1 1 140px"><select id="hs" style="flex:0 0 150px"><option value="">${x('All','Все')}</option>${[['Pending','Under review','На проверке'],['Approved','Approved','Подтверждено'],['Declined','Declined','Отклонено']].map(o=>`<option value="${o[0]}" ${HS==o[0]?'selected':''}>${x(o[1],o[2])}</option>`).join('')}</select></div>`:'';
document.addEventListener('input',e=>{if(e.target.id=='hq'){HQ=e.target.value.toLowerCase();render();const i=$('#hq');i.focus();i.setSelectionRange(i.value.length,i.value.length)}});
document.addEventListener('change',e=>{if(e.target.id=='hs'){HS=e.target.value;render()}});
if(!API)return;
const H=()=>({'Content-Type':'application/json','X-Init-Data':TGW?TGW.initData:'',...(DU?{'X-Dev-User':DU}:{})});
const ER={insufficient_balance:['Insufficient balance','Недостаточно средств'],out_of_stock:['Out of stock','Нет в наличии'],promo_not_found:['Promo code not found','Промокод не найден'],promo_expired:['Promo code expired','Срок промокода истёк'],promo_limit:['Promo limit reached','Лимит промокода исчерпан'],tx_already_used:['This TX hash was already used','Этот TX уже использован'],tx_hash_required:['Enter the TX hash','Укажите хеш транзакции'],bad_amount:['Amount must be $5–$10 000','Сумма от $5 до $10 000'],too_many_requests:['Too many requests — wait a bit','Слишком много запросов — подождите'],forbidden:['No access','Нет доступа'],unauthorized:['Open the shop from Telegram','Откройте магазин из Telegram']};
const api=async(p,b)=>{const r=await fetch(API+p,{method:b===undefined?'GET':'POST',headers:H(),body:b===undefined?undefined:JSON.stringify(b)});const j=await r.json().catch(()=>({}));if(!r.ok){const e=ER[j.error];toast(e?x(e[0],e[1]):(j.error||'Error'));throw new Error(j.error)}return j};
const ap=S=>{st.bal=S.user.bal;st.act=S.user.act;st.nt=S.nt;st.chat=S.chat;SRV_ADMIN=!!S.user.isAdmin;Object.keys(G).forEach(g=>{if(S.stock[g]!=null)G[g][2]=S.stock[g];if(S.prices[g])G[g][1]=S.prices[g]});
st.orders=S.orders.map(o=>({id:o.id,k:o.k,q:o.q,t:o.t,s:o.s,d:o.d,g:o.items[0].g,rv:(st.orders.find(z=>z.id==o.id)||{}).rv,txt:o.items.map(i=>genTxt(i.g,i.q,o.id)).join('\n')}));
st.proofs=S.topups.map(z=>({id:z.id,a:z.a,s:z.s,d:z.d,hash:z.hash,r:z.r,fn:'—',sz:''}));
if(S.admin){st.aprf=S.admin.topups.map(z=>({id:z.id,a:z.a,s:z.s,d:z.d,hash:z.hash,u:z.u,fn:'—',sz:''}));Object.keys(PROMOS).forEach(k=>delete PROMOS[k]);Object.assign(PROMOS,S.admin.promos);USERS.length=0;S.admin.users.forEach(u=>USERS.push({u:u.u,id:u.id,b:u.b,o:u.o,d:Math.max(0,Math.floor((Date.now()-new Date((u.last||'').replace(' ','T')))/864e5))||0}))}
bell();render()};
const sync=async()=>{try{ap(await api('/api/me'))}catch(_){}};
sync();setInterval(()=>{const a=document.activeElement;if(document.hidden||(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName))||$('#modal.on'))return;sync()},10000);
let busy=0;const idem=()=>(crypto.randomUUID?crypto.randomUUID():Date.now()+''+Math.random());
const done=o=>{fx('ok');modal(`<h3>${x('Order completed','Заказ выполнен')}</h3><p class="sub">ID #${o.id} · ${$m(o.t)}</p><button class="btn" style="width:100%;margin-bottom:8px" data-act="dl" data-v="${o.id}">${ic('dl','sm')} ${x('Download .txt','Скачать .txt')}</button><button class="pc" style="width:100%;margin-bottom:8px" data-act="file" data-v="${o.id}">${ic('file','sm')} ${x('Preview file','Посмотреть файл')}</button><button class="btn out" style="width:100%" data-act="close">OK</button>`)};
const buy=async items=>{const j=await api('/api/buy',{items,promo:st.promo?st.pc||'':'',idem:idem()});st.promo=0;st.pc=null;ap(j.state);done(j.order)};
const chatSend=async()=>{const i=$('#cx'),t=i&&i.value.trim();if(!t)return;i.value='';ap(await api('/api/chat',{text:t}));fx('tap')};
const exp=async k=>{const r=await fetch(API+'/api/admin/export?kind='+k,{headers:H()});if(!r.ok)return toast('No access');const a=document.createElement('a');a.href=URL.createObjectURL(await r.blob());a.download=k+'.csv';document.body.appendChild(a);a.click();a.remove()};
document.addEventListener('click',async e=>{const el=e.target.closest('[data-act],[data-c],#bell');if(!el)return;if(el.id=='bell'){api('/api/read',{}).catch(()=>{});return}
const a=el.dataset.act,c=el.dataset.c,g=el.dataset.g,v=el.dataset.v;const own=['pay','sendp','pok','pno2','promo'].includes(a)||['pay','send','bcast','pnew','pdel','csvo','csvt'].includes(c);if(!own)return;
e.stopImmediatePropagation();e.preventDefault();if(busy)return;busy=1;
try{if(a=='pay')await buy([{g,q:qn(g)}]);
else if(c=='pay'){const ct=st.cart||{};await buy(Object.keys(ct).map(k=>({g:k,q:ct[k]})));st.cart={};render()}
else if(a=='sendp'){const h=($('#ph')||{value:''}).value.trim();ap(await api('/api/topup',{amount:st.pay.amt,hash:h}));st.pay=null;render();toast(x('Sent! An admin will confirm your top-up','Отправлено! Админ подтвердит пополнение'))}
else if(a=='pok')ap(await api('/api/admin/topup',{id:v,action:'approve'}));
else if(a=='pno2'){ap(await api('/api/admin/topup',{id:v,action:'decline',reason:($('#dr')||{value:''}).value}));modal('')}
else if(a=='promo'){const code=$('#pi').value.trim().toUpperCase(),j=await api('/api/promo',{code});st.promo=j.p;st.pc=code;toast(x('Promo applied','Промокод применён'));render()}
else if(c=='send')await chatSend();
else if(c=='bcast'){const t=$('#bct').value.trim();if(!t)return toast('Write a message');const j=await api('/api/admin/broadcast',{text:t});toast('Sent to '+j.sent+' users');$('#bct').value=''}
else if(c=='pnew'){ap(await api('/api/admin/promo',{code:$('#pnc').value,p:$('#pnp').value,lim:$('#pnl').value,exp:$('#pne').value}))}
else if(c=='pdel'){ap(await api('/api/admin/promo',{code:v,del:1}))}
else if(c=='csvo')await exp('orders');else if(c=='csvt')await exp('topups')}catch(_){}finally{busy=0}},true);
document.addEventListener('change',async e=>{const t=e.target,a=t.dataset&&t.dataset.pa;if(!a)return;e.stopImmediatePropagation();const pr=PROMOS[t.dataset.v];try{ap(await api('/api/admin/promo',{code:t.dataset.v,p:pr.p,lim:a=='lim'?t.value:pr.lim,exp:a=='exp'?t.value:pr.exp}))}catch(_){}},true);
document.addEventListener('keydown',e=>{if(e.target.id=='cx'&&e.key=='Enter'){e.stopImmediatePropagation();chatSend()}},true);
})();
</script>
